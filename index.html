<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friend Errand - Rare Friends VIP V2</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0b0e14; 
            color: #fff; 
            text-align: center; 
            margin: 0;
            padding: 20px; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container { 
            width: 100%;
            max-width: 400px; 
            background: #141820; 
            border: 1px solid #1f293d;
            padding: 20px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        h2 { 
            margin: 0; 
            color: #00ffaa; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            font-size: 18px;
        }
        .title-nft-img {
            width: 24px;
            height: 24px;
            background: #000;
            border-radius: 4px;
            object-fit: contain;
            border: 1px solid #00ffaa;
        }
        .wallet-container {
            display: flex;
            gap: 5px;
        }
        .wallet-badge {
            background: #0d2822;
            color: #00ffaa;
            border: 1px solid #00ffaa;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .wallet-badge.demo {
            background: #1a202c;
            color: #a0aec0;
            border: 1px solid #4a5568;
        }
        .wallet-badge:active { transform: scale(0.95); }
        .sub-header {
            text-align: center;
            font-size: 11px;
            color: #00ffaa;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }
        .nft-card {
            background: #12161f;
            border: 1px dashed #00ffaa;
            border-radius: 12px;
            padding: 12px;
            margin: 12px 0;
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
        }
        .nft-img {
            width: 55px;
            height: 55px;
            background: #000;
            border-radius: 8px;
            object-fit: contain;
            border: 1px solid #00ffaa;
        }
        .nft-info h4 { margin: 0 0 3px 0; color: #fff; font-size: 14px; }
        .nft-info p { margin: 0; color: #00ffaa; font-size: 11px; }
        .xp-container {
            width: 100%;
            background: #1a2230;
            border-radius: 4px;
            height: 6px;
            margin-top: 6px;
            overflow: hidden;
        }
        .xp-bar {
            width: 0%;
            height: 100%;
            background: #00ffaa;
            transition: width 0.4s ease;
        }
        .stats-box { 
            display: flex;
            justify-content: space-between;
            background: #12161f; 
            padding: 10px 14px; 
            border-radius: 10px; 
            margin: 12px 0;
            font-size: 12px;
            border: 1px solid #1f293d;
        }
        .balance-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0;
            font-size: 13px;
            padding: 0 4px;
        }
        .balance-val {
            color: #00ffaa;
            font-weight: bold;
            font-size: 15px;
        }
        .tabs-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .tab-btn {
            flex: 1;
            padding: 8px;
            background: #12161f;
            border: 1px solid #1f293d;
            color: #a0aec0;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .tab-btn.active {
            background: #0d2822;
            border-color: #00ffaa;
            color: #00ffaa;
        }
        .action-btn { 
            background: linear-gradient(135deg, #00ffaa, #00b377); 
            color: #0b0e14; 
            font-weight: bold;
            border: none; 
            padding: 12px; 
            font-size: 14px; 
            border-radius: 10px; 
            cursor: pointer; 
            width: 100%; 
            box-shadow: 0 4px 15px rgba(0,255,170,0.3);
            transition: 0.2s;
        }
        .claim-btn {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: #fff;
            margin-top: 8px;
            box-shadow: 0 4px 15px rgba(255,71,87,0.3);
            display: none;
        }
        .action-btn:active { transform: scale(0.98); }
        .action-btn:disabled { background: #333; color: #777; box-shadow: none; cursor: not-allowed; }
        
        .log-box { 
            margin-top: 12px; 
            font-size: 12px; 
            padding: 10px;
            background: #12161f;
            border-radius: 8px;
            min-height: 38px; 
            color: #ff5555;
            border: 1px solid #1f293d;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.3;
            gap: 6px;
        }
        .log-nft-icon {
            width: 16px;
            height: 16px;
            object-fit: contain;
            border-radius: 2px;
            vertical-align: middle;
        }
        .pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>
                <img src="https://raw2.seadn.io/robinhood/0x14c49e6118f46525de9ab41a51cbaa3c6ebf181d/29d5a25f2be029bbf85870b9dccd00/bf29d5a25f2be029bbf85870b9dccd00.svg" alt="NFT Icon" class="title-nft-img">
                Friend Errand
            </h2>
            <div class="wallet-container">
                <div class="wallet-badge" id="web3Btn" onclick="toggleWeb3Wallet()">Connect</div>
                <div class="wallet-badge demo" id="demoBtn" onclick="toggleDemoWallet()">Demo</div>
            </div>
        </div>
        
        <div class="sub-header">$RF Protocol Hub | V2 Live</div>
        
        <div class="nft-card">
            <img src="https://raw2.seadn.io/robinhood/0x14c49e6118f46525de9ab41a51cbaa3c6ebf181d/29d5a25f2be029bbf85870b9dccd00/bf29d5a25f2be029bbf85870b9dccd00.svg" alt="Friend #335482" class="nft-img" id="nftImage">
            <div class="nft-info" style="width: 100%;">
                <h4 style="display:flex; justify-content:space-between;"><span>Friend #335482</span> <span id="levelDisplay" style="color:#00ffaa; font-size:12px;">Lvl 1</span></h4>
                <p id="nftStatus">XP: <span id="xpText">0</span>/100</p>
                <div class="xp-container">
                    <div class="xp-bar" id="xpBar"></div>
                </div>
            </div>
        </div>

        <div class="stats-box">
            <div>🔥 Ticket Burn: <span style="color:#fff;">30%</span></div>
            <div>🎁 Pool Reward: <span style="color:#fff;">70%</span></div>
        </div>

        <div class="balance-row">
            <div>$RF Balance: <span class="balance-val" id="rfBalance">10.00</span></div>
            <div style="color: #a0aec0;">Ticket Cost: <span id="ticketCostDisplay" style="color:#ff5555;">1.0 $RF</span></div>
        </div>

        <div class="tabs-row">
            <div class="tab-btn active" id="stdTab" onclick="selectJob('standard')">Standard Errand</div>
            <div class="tab-btn" id="riskTab" onclick="selectJob('risk')">⚡ High Risk Heist</div>
        </div>

        <button class="action-btn" id="actionBtn" onclick="startErrand()">Start Standard Errand (Cost: 1.0 $RF)</button>
        <button class="action-btn claim-btn" id="claimBtn" onclick="claimTokens()">Claim Free RF (+5)</button>
        
        <div class="log-box" id="log">
            ⚠️ Please connect your wallet first!
        </div>
    </div>

    <script>
        let balance = 10.00;
        let isWorking = false;
        let selectedJob = 'standard';
        let faucetClaims = 0;
        let walletConnected = false; 
        let isDemoWallet = false;
        let currentXP = 0;
        let currentLevel = 1;

        // Heavy Deep Robotic Voice Function using Speech Synthesis API
        function speakRobotic(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Purani awaz rokne ke liye
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.pitch = 0.2; // Moti/Deep awaz ke liye pitch low ki gayi hai
                utterance.rate = 0.9;  // Thoda robotic heavy style
                utterance.volume = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        async function toggleWeb3Wallet() {
            const web3Btn = document.getElementById('web3Btn');
            const demoBtn = document.getElementById('demoBtn');
            const logBox = document.getElementById('log');
            const nftIconHtml = `<img src="https://raw2.seadn.io/robinhood/0x14c49e6118f46525de9ab41a51cbaa3c6ebf181d/29d5a25f2be029bbf85870b9dccd00/bf29d5a25f2be029bbf85870b9dccd00.svg" class="log-nft-icon">`;

            if (walletConnected && !isDemoWallet) {
                walletConnected = false;
                web3Btn.innerText = "Connect";
                demoBtn.style.opacity = '1';
                logBox.style.color = '#ff5555';
                logBox.innerHTML = `${nftIconHtml} Wallet Disconnected.`;
                speakRobotic("Wallet disconnected");
                return;
            }

            if (typeof window.ethereum !== 'undefined') {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    const account = accounts[0];
                    web3Btn.innerText = account.substring(0, 4) + '...' + account.substring(account.length - 4);
                    demoBtn.style.opacity = '0.5';
                    walletConnected = true;
                    isDemoWallet = false;
                    speakRobotic("Web 3 wallet connected. You can play now");
                    logBox.style.color = '#00ffaa';
                    logBox.innerHTML = `${nftIconHtml} Web3 Wallet Connected. Play Now!`;
                } catch (error) {
                    logBox.style.color = '#ff5555';
                    logBox.innerHTML = `${nftIconHtml} Connection rejected.`;
                }
            } else {
                logBox.style.color = '#ff5555';
                logBox.innerHTML = `${nftIconHtml} No Web3 found! Use dApp browser or Demo.`;
                speakRobotic("No web three wallet found");
            }
        }

        function toggleDemoWallet() {
            const web3Btn = document.getElementById('web3Btn');
            const demoBtn = document.getElementById('demoBtn');
            const logBox = document.getElementById('log');
            const nftIconHtml = `<img src="https://raw2.seadn.io/robinhood/0x14c49e6118f46525de9ab41a51cbaa3c6ebf181d/29d5a25f2be029bbf85870b9dccd00/bf29d5a25f2be029bbf85870b9dccd00.svg" class="log-nft-icon">`;

            if (walletConnected && isDemoWallet) {
                walletConnected = false;
                demoBtn.innerText = "Demo";
                web3Btn.style.opacity = '1';
                logBox.style.color = '#ff5555';
                logBox.innerHTML = `${nftIconHtml} Demo Wallet Disconnected.`;
                speakRobotic("Demo wallet disconnected");
                return;
            }

            demoBtn.innerText = "0x7F...3B91";
            web3Btn.style.opacity = '0.5';
            walletConnected = true;
            isDemoWallet = true;
            speakRobotic("Demo mode activated. You can play your game now. Let's enjoy");
            logBox.style.color = '#00ffaa';
            logBox.innerHTML = `${nftIconHtml} Demo Mode Activated. Let's Enjoy!`;
        }

        function selectJob(jobType) {
            selectedJob = jobType;
            const stdTab = document.getElementById('stdTab');
            const riskTab = document.getElementById('riskTab');
            const actionBtn = document.getElementById('actionBtn');
            const costDisplay = document.getElementById('ticketCostDisplay');

            if (jobType === 'standard') {
                stdTab.classList.add('active');
                riskTab.classList.remove('active');
                actionBtn.innerText = "Start Standard Errand (Cost: 1.0 $RF)";
                costDisplay.innerText = "1.0 $RF";
            } else {
                riskTab.classList.add('active');
                stdTab.classList.remove('active');
                actionBtn.innerText = "🚀 Start High Risk Heist (Cost: 2.0 $RF)";
                costDisplay.innerText = "2.0 $RF";
            }
        }

        function startErrand() {
            const logBox = document.getElementById('log');
            const nftIconHtml = `<img src="https://raw2.seadn.io/robinhood/0x14c49e6118f46525de9ab41a51cbaa3c6ebf181d/29d5a25f2be029bbf85870b9dccd00/bf29d5a25f2be029bbf85870b9dccd00.svg" class="log-nft-icon">`;
            
            if (!walletConnected) {
                speakRobotic("Please connect your wallet first");
                logBox.style.color = '#ff5555';
                logBox.innerHTML = `${nftIconHtml} Please connect your wallet first!`;
                return;
            }

            if (isWorking) return;
            let cost = selectedJob === 'standard' ? 1.0 : 2.0;

            if (balance < cost) {
                speakRobotic("Insufficient balance");
                logBox.style.color = '#ff5555';
                logBox.innerHTML = `${nftIconHtml} Insufficient $RF balance! Claim free tokens.`;
                return;
            }

            balance -= cost;
            updateUI();
            isWorking = true;
            
            const btn = document.getElementById('actionBtn');
            btn.disabled = true;
            
            logBox.style.color = '#00ffaa';
            logBox.classList.add('pulse');
            logBox.innerHTML = `${nftIconHtml} Friend #335482 executing errand protocol...`;

            setTimeout(() => {
                let rand = Math.random() * 100;
                let totalReward = 0;
                let resultText = "";
                let multiplier = selectedJob === 'risk' ? 2 : 1; 

                if (rand < 20) {
                    totalReward = 0;
                    resultText = "🎒 Empty bag! Zero yield.";
                } else if (rand < 55) {
                    totalReward = 1.0 * multiplier;
                    resultText = "✉️ Mail run successful!";
                } else if (rand < 80) {
                    totalReward = 2.0 * multiplier;
                    resultText = "🛍️ Shop drop complete!";
                } else if (rand < 95) {
                    totalReward = 4.0 * multiplier;
                    resultText = "💎 Treasure jackpot!";
                } else {
                    totalReward = 8.0 * multiplier;
                    resultText = "🏛️ Vault unlocked! LEGENDARY!";
                    confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
                }

                let burned = totalReward * 0.30;
                let userGain = totalReward * 0.70;
                balance += userGain;

                currentXP += 25;
                if (currentXP >= 100) {
                    currentXP = 0;
                    currentLevel++;
                }
                
                updateUI();
                logBox.classList.remove('pulse');
                
                if (totalReward > 0) {
                    logBox.innerHTML = `${nftIconHtml} ${resultText} | <span style="color:#00ffaa;">+${userGain.toFixed(2)} $RF</span> | <span style="color:#ff5555;">Burn: ${burned.toFixed(2)}</span>`;
                } else {
                    logBox.innerHTML = `${nftIconHtml} ${resultText} (0 $RF)`;
                }
                
                btn.disabled = false;
                isWorking = false;
            }, 1600);
        }

        function claimTokens() {
            const logBox = document.getElementById('log');
            const nftIconHtml = `<img src="https://raw2.seadn.io/robinhood/0x14c49e6118f46525de9ab41a51cbaa3c6ebf181d/29d5a25f2be029bbf85870b9dccd00/bf29d5a25f2be029bbf85870b9dccd00.svg" class="log-nft-icon">`;
            
            if (!walletConnected) {
                speakRobotic("Please connect your wallet first");
                logBox.style.color = '#ff5555';
                logBox.innerHTML = `${nftIconHtml} Please connect your wallet first!`;
                return;
            }

            if (faucetClaims >= 3) {
                speakRobotic("Faucet limit reached");
                logBox.style.color = '#ff5555';
                logBox.innerHTML = `${nftIconHtml} Faucet limit reached!`;
                return;
            }
            speakRobotic("Tokens claimed successfully");
            balance += 5.0;
            faucetClaims++;
            updateUI();
            logBox.style.color = '#00ffaa';
            logBox.innerHTML = `${nftIconHtml} Faucet dispensed +5 $RF!`;
        }

        function updateUI() {
            document.getElementById('rfBalance').innerText = balance.toFixed(2);
            document.getElementById('levelDisplay').innerText = `Lvl ${currentLevel}`;
            document.getElementById('xpText').innerText = currentXP;
            document.getElementById('xpBar').style.width = `${currentXP}%`;

            const claimBtn = document.getElementById('claimBtn');
            const actionBtn = document.getElementById('actionBtn');
            let cost = selectedJob === 'standard' ? 1.0 : 2.0;
            
            if (balance < cost) {
                claimBtn.style.display = 'block';
                actionBtn.style.marginBottom = '5px';
            } else {
                claimBtn.style.display = 'none';
                actionBtn.style.marginBottom = '0px';
            }
        }
    </script>
</body>
</html>
